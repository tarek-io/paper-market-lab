<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Market</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="viewer">
      <header>
        <span>AI paper model</span>
        <h1>Paper Market</h1>
      </header>

      <section class="hero">
        <p class="kicker">MODEL</p>
        <div id="modelDecision" class="decision">—</div>
        <p id="decisionReason" class="reason">—</p>
      </section>

      <section class="pnl">
        <span>Fake P&amp;L</span>
        <strong id="pnlValue">—</strong>
      </section>

      <section class="timeline-wrap">
        <input id="timeSlider" type="range" min="0" max="1" step="1" value="0" aria-label="Simulation time" />
        <div class="time-row">
          <span id="virtualTime">—</span>
          <span id="timePosition">—</span>
        </div>
      </section>

      <section class="stats" aria-label="Model inputs">
        <div><span>Demand</span><strong id="demand">—</strong></div>
        <div><span>Expected edge</span><strong id="edge">—</strong></div>
        <div><span>Forecast use</span><strong id="utilization">—</strong></div>
      </section>

      <svg id="chart" viewBox="0 0 900 150" role="img" aria-label="Paper profit history"></svg>

      <footer>Fake money · synthetic market · model controls itself</footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
