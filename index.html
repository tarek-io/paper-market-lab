<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Capital</title>
    <link rel="stylesheet" href="./styles.css?v=capital-1" />
  </head>
  <body>
    <main class="viewer">
      <header>
        <span>Deterministic paper model</span>
        <h1>Paper Capital</h1>
      </header>

      <form id="capitalForm" class="capital-form">
        <label for="capitalInput">Fake money to put in now</label>
        <div class="money-input">
          <span>$</span>
          <input id="capitalInput" name="capital" type="number" min="0" step="1" inputmode="decimal" value="100" />
        </div>
      </form>

      <section class="result" aria-live="polite">
        <p id="action" class="action">—</p>
        <div class="arrow-row">
          <strong id="startingCapital">—</strong>
          <span>→</span>
          <strong id="endingCapital">—</strong>
        </div>
        <p id="profit" class="profit">—</p>
      </section>

      <section class="explain">
        <p id="explanation">—</p>
      </section>

      <footer>Fake money · synthetic market · deterministic algorithm</footer>
    </main>
    <script type="module" src="./app.js?v=capital-1"></script>
  </body>
</html>
